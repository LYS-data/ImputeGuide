name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m imputeguide validate-config --root .

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test the installed wheel outside the repository
        run: |
          python -m venv /tmp/imputeguide-wheel
          /tmp/imputeguide-wheel/bin/python -m pip install dist/*.whl
          /tmp/imputeguide-wheel/bin/python -m pip check
          cd /tmp
          /tmp/imputeguide-wheel/bin/python -c 'import numpy as np; from imputeguide import build_imputer; x = np.array([[1.0, np.nan], [2.0, 3.0], [4.0, 5.0]]); y = build_imputer("knni", n_neighbors=2).fit_transform(x); assert np.isfinite(y).all()'
          printf 'a,b\n-5.0,-5.1\n-4.8,\n-5.2,-4.9\n-4.9,-5.2\n-5.1,-4.8\n-4.7,-5.0\n0.0,0.1\n0.2,-0.1\n-0.2,0.0\n0.1,\n-0.1,0.2\n0.0,-0.2\n5.0,5.1\n5.2,4.9\n4.8,5.0\n5.1,\n4.9,5.2\n5.0,4.8\n' > /tmp/imputeguide-input.csv
          /tmp/imputeguide-wheel/bin/imputeguide run --input /tmp/imputeguide-input.csv --output /tmp/imputeguide-output --config-root "$GITHUB_WORKSPACE" --clusters 3 --anchor mode --history-ranking knni --opportunity-score 1.0
          test -s /tmp/imputeguide-output/completed.csv
          test -s /tmp/imputeguide-output/selection.json

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t imputeguide .
      - run: docker run --rm imputeguide
