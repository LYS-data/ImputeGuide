name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paper-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_imputeguide_core.py -q
      - run: python -m imputeguide validate-config --root .
