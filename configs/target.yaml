profile:
  static_sample_rows_max: 1000
  probe_sample_rows_max: 400
  fixed_probe_methods: [mean, knni, mice, missforest, gain]
  missing_indicators_for_undefined_values: true
  normalization_source: historical_training_statistics

candidate_generation:
  history_dataset_neighbors: 5
  history_quota: 2
  probe_quota: 2
  total_challenger_budget: 4
  full_table_attempt_budget: 5
  max_methods_per_probe_family: 1
  probe_variation_penalty: 0.50

structural_validation:
  validation_sample_rows_max: 300
  component_weights:
    silhouette: 0.40
    row_resampling_consistency: 0.35
    feature_subspace_agreement: 0.25
  discovery_perturbations: 3
  confirmation_perturbations: 5
  require_complete_paired_scores: true
  require_disjoint_discovery_and_confirmation: true

confirmation:
  bootstrap_repeats: 2000
  lower_tail_probability: 0.10
  switch_margin: 0.005
  equality_action: retain_stable_strategy

seeds:
  namespace_policy: deterministic_disjoint_namespaces
  probe_offset: 100003
  discovery_offset: 200003
  confirmation_offset: 300007
  repeat_stride: 7919

configuration_scope: paper_method_parameters
