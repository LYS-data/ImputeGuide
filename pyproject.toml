[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imputeguide"
version = "0.1.0"
description = "Budget-constrained whole-table imputer selection for clustering"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Xiaoou Ding"},
  {name = "Yanshuo Liu"},
  {name = "Haifeng Cheng"},
  {name = "Muyun Zhou"},
  {name = "Chen Wang"},
  {name = "Hengtong Zhang"},
  {name = "Hongzhi Wang"},
]
requires-python = ">=3.11,<3.12"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.1,<2.2",
  "scipy>=1.11,<1.12",
  "scikit-learn>=1.4,<1.5",
  "joblib>=1.3,<1.4",
  "packaging>=24,<25",
  "pyyaml>=6.0,<7.0",
  "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9.0"]

[project.scripts]
imputeguide = "imputeguide.__main__:main"

[tool.setuptools.packages.find]
where = ["src", ".", "DiffPuter-main/baselines"]
include = [
  "imputeguide*",
  "imputers*",
  "utils*",
  "external_dependencies*",
  "MCFlow*",
  "Missdiff_SDE*",
]

[tool.setuptools.package-data]
MCFlow = ["LICENSE", "README.md"]
Missdiff_SDE = ["README.md"]
external_dependencies = ["*/LICENSE", "*/README.md", "*/*/LICENSE", "*/*/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
